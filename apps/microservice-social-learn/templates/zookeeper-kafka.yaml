{{- if .Values.infra.zookeeper.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  labels:
    app: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: {{ .Values.infra.zookeeper.image }}
          ports:
            - containerPort: {{ .Values.infra.zookeeper.port }}
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: {{ .Values.infra.zookeeper.port | quote }}
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  type: ClusterIP
  selector:
    app: zookeeper
  ports:
    - name: zookeeper
      port: {{ .Values.infra.zookeeper.port }}
      targetPort: {{ .Values.infra.zookeeper.port }}
{{- end }}

{{- if .Values.infra.kafka.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-zookeeper
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Zookeeper at zookeeper:2181..."
              until nc -z zookeeper 2181; do
                echo "Zookeeper not ready, retrying in 3s..."
                sleep 3
              done
              echo "Zookeeper is ready!"
      containers:
        - name: kafka
          image: {{ .Values.infra.kafka.image }}
          ports:
            - containerPort: {{ .Values.infra.kafka.port }}
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: kafka
      port: {{ .Values.infra.kafka.port }}
      targetPort: {{ .Values.infra.kafka.port }}
{{- end }}