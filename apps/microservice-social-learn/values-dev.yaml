global:
  imagePullPolicy: Always
  secretName: social-app-secret

infra:
  mongodb:
    enabled: true
    image: mongo:6
    storage: 5Gi
    port: 27017

  redis:
    enabled: true
    image: redis:latest
    storage: 2Gi
    port: 6379

  zookeeper:
    enabled: true
    image: confluentinc/cp-zookeeper:7.5.0
    port: 2181

  kafka:
    enabled: true
    image: confluentinc/cp-kafka:7.5.0
    port: 9092

kong:
  enabled: true
  image: kong:latest

  service:
    type: LoadBalancer

  cors:
    origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "https://your-frontend-domain.com"

  rateLimiting:
    minute: 200
    hour: 5000

  requestSizeLimit:
    allowedPayloadSize: 10
    sizeUnit: megabytes

  consumers:
    - username: nhutanh09
      jwtKey: nhutanh09
      algorithm: HS256
      secret: "${JWT_SECRET}"

services:
  auth-service:
    enabled: true
    replicas: 1
    image:
      repository: sociallearn.azurecr.io/auth-service
      tag: b8c943af4bcd083ffa824a143a8f92e121e5c682
    port: 8081
    requireJwt: false
    routes:
      - /auth
      - /user
      - /follow
      - /admin
    env:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongodb:27017/auth_db
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: auth-service
      KAFKA_GROUP_ID: auth-service-consumer
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEFAULT_AVATAR_ID: "a94b0855-0bc4-4f4a-a87d-5aaf99e84da1"
      DEFAULT_AVATAR_URL: "https://nlyexidgtzdfthpbmrba.supabase.co/storage/v1/object/sign/uploads/IMG_7884.jpeg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9hMzZjMDg0MC05YmExLTQ4MWYtYWMxYy0xY2ZkYTlmM2U1NzEiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ1cGxvYWRzL0lNR183ODg0LmpwZWciLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzgyMzc3NzE4LCJleHAiOjE3ODQ5Njk3MTh9.gapzoX592WHYDKc0j0QkJzzmlCSzDRI-7ExwjD4p_4E"
      DEFAULT_AVATAR_TYPE: "image/jpeg"
      DEFAULT_AVATAR_NAME: "default-avatar.jpg"
    secretEnv:
      JWT_SECRET: JWT_SECRET
      JWT_REFRESH_SECRET: JWT_REFRESH_SECRET

  upload-service:
    enabled: true
    replicas: 1
    image:
      repository: sociallearn.azurecr.io/upload-service
