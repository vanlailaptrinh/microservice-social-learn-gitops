apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: social-app-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:YOUR_ORG/social-app-gitops.git
    targetRevision: main
    path: apps/microservice-social-learn
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: social-app-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
