apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: social-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:vanlailaptrinh/microservice-social-learn-gitops.git
    targetRevision: main
    path: apps/microservice-social-learn
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: social-app-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true